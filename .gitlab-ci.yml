# GitLab CI/CD Pipeline для Linux Training Simulator
# Автоматизация: тесты → сборка образов → деплой

stages:
  - lint
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA

# Глобальные настройки для Docker
.docker_template: &docker_template
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# ============================================================
# STAGE 1: LINT - проверка кода
# ============================================================

lint:python:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install flake8 black mypy
  script:
    - echo "🔍 Проверка Python кода..."
    - flake8 backend/ --max-line-length=120 --exclude=venv,__pycache__
    - black --check backend/
    - mypy backend/ --ignore-missing-imports || true
  allow_failure: true

lint:javascript:
  stage: lint
  image: node:18-alpine
  before_script:
    - cd frontend/web
    - npm ci
  script:
    - echo "🔍 Проверка JavaScript/React кода..."
    - npm run lint || true
  allow_failure: true

# ============================================================
# STAGE 2: TEST - запуск тестов
# ============================================================

test:backend:
  stage: test
  image: python:3.12-slim
  services:
    - postgres:16-alpine
  variables:
    POSTGRES_DB: astra_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/astra_test
  before_script:
    - cd backend
    - pip install -r requirements.txt
    - pip install pytest pytest-cov pytest-asyncio httpx
  script:
    - echo "🧪 Запуск тестов backend..."
    - pytest tests/ -v --cov=backend --cov-report=xml --cov-report=term
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/coverage.xml
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop

test:frontend:
  stage: test
  image: node:18-alpine
  before_script:
    - cd frontend/web
    - npm ci
  script:
    - echo "🧪 Запуск тестов frontend..."
    - npm test -- --coverage --watchAll=false
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/web/coverage/cobertura-coverage.xml
    paths:
      - frontend/web/coverage/
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - develop

# ============================================================
# STAGE 3: BUILD - сборка Docker образов
# ============================================================

build:backend:
  <<: *docker_template
  stage: build
  script:
    - echo "🔨 Сборка Backend образа..."
    - docker build -f Dockerfile.backend -t $BACKEND_IMAGE .
    - docker tag $BACKEND_IMAGE $CI_REGISTRY_IMAGE/backend:latest
    - docker push $BACKEND_IMAGE
    - docker push $CI_REGISTRY_IMAGE/backend:latest
  only:
    - main
    - develop
    - tags

build:frontend:
  <<: *docker_template
  stage: build
  script:
    - echo "🔨 Сборка Frontend образа..."
    - docker build -f frontend/web/Dockerfile -t $FRONTEND_IMAGE frontend/web/
    - docker tag $FRONTEND_IMAGE $CI_REGISTRY_IMAGE/frontend:latest
    - docker push $FRONTEND_IMAGE
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  only:
    - main
    - develop
    - tags

build:sandbox-images:
  <<: *docker_template
  stage: build
  script:
    - echo "🔨 Сборка sandbox образов..."
    - docker build -f images/Dockerfile.astra-vnc -t $CI_REGISTRY_IMAGE/astra-vnc:latest images/
    - docker push $CI_REGISTRY_IMAGE/astra-vnc:latest
  only:
    - main
    - tags
  when: manual  # Ручной запуск для больших образов

# ============================================================
# STAGE 4: DEPLOY - развертывание
# ============================================================

deploy:test:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-compose
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $TEST_SERVER_IP >> ~/.ssh/known_hosts
  script:
    - echo "🚀 Деплой на тестовый сервер..."
    - |
      ssh $TEST_SERVER_USER@$TEST_SERVER_IP << 'EOF'
        cd /opt/astra-trainer
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        docker-compose pull
        docker-compose up -d --remove-orphans
        docker-compose ps
      EOF
    - echo "✅ Деплой завершен!"
  environment:
    name: test
    url: http://$TEST_SERVER_IP
  only:
    - develop
  when: manual

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-compose
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_SERVER_IP >> ~/.ssh/known_hosts
  script:
    - echo "🚀 Деплой на production сервер..."
    - |
      ssh $PROD_SERVER_USER@$PROD_SERVER_IP << 'EOF'
        cd /opt/astra-trainer
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        docker-compose pull
        docker-compose up -d --remove-orphans
        docker system prune -af --volumes
        docker-compose ps
      EOF
    - echo "✅ Production деплой завершен!"
  environment:
    name: production
    url: https://$PROD_DOMAIN
  only:
    - main
    - tags
  when: manual

# ============================================================
# ДОПОЛНИТЕЛЬНЫЕ ДЖОБЫ
# ============================================================

# Проверка безопасности зависимостей
security:check:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install safety bandit
  script:
    - echo "🔒 Проверка безопасности..."
    - safety check -r backend/requirements.txt || true
    - bandit -r backend/ -f json -o bandit-report.json || true
  artifacts:
    paths:
      - bandit-report.json
    expire_in: 1 week
  allow_failure: true

# Очистка старых образов
cleanup:images:
  <<: *docker_template
  stage: deploy
  script:
    - echo "🧹 Очистка старых образов..."
    - docker image prune -af --filter "until=168h"
  only:
    - schedules
  when: manual
