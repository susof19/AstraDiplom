[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
# Отключаем автоматическое чтение конфигураций из других мест
[include]
files = /etc/supervisor/conf.d/*.conf

[program:vnc]
command=/usr/local/bin/start-vnc.sh
user=root
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/vnc.log
stderr_logfile=/var/log/supervisor/vnc.err
priority=100

[program:novnc]
# websockify с автоматической передачей пароля через параметр --target-config
# Пароль передается через переменную окружения VNC_PASSWORD
command=/opt/noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 0.0.0.0:6080 --web /opt/noVNC
user=root
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err
priority=200
environment=VNC_PASSWORD="sandbox123"

# Явно отключаем dbus (если он где-то определен)
# dbus не нужен как системный сервис - dbus-launch запускается в VNC сессии
[program:dbus]
command=/bin/true
autostart=false
autorestart=false
priority=999
