name: "Изменение фона рабочего стола"
description: "Измените фон рабочего стола на изображение из папки Изображения"
level: "A"
difficulty: 1
estimated_time: 5

objectives:
  - "Открыть настройки рабочего стола XFCE"
  - "Выбрать изображение из папки Изображения"
  - "Применить изменения"

hints:
  - "Щёлкните правой кнопкой на рабочем столе и выберите 'Параметры рабочего стола'"
  - "Или откройте Меню → Настройки → Рабочий стол"
  - "Изображения находятся в /home/astrauser/Изображения"
  - "Выберите любое изображение и нажмите 'Закрыть'"

setup:
  # Создаём тестовые изображения
  files:
    - path: "/home/astrauser/Изображения/astra-wallpaper-1.jpg"
      content: "test_image_1"
    - path: "/home/astrauser/Изображения/astra-wallpaper-2.jpg"
      content: "test_image_2"

checks:
  - name: "Фон изменён"
    type: "command_output"
    command: "xfconf-query -c xfce4-desktop -p /backdrop/screen0/monitor0/workspace0/last-image"
    contains: "/home/astrauser/Изображения"
    points: 100

