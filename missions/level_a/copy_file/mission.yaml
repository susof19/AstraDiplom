name: Копирование файла
description: Скопируйте файл photo.jpg из папки Downloads в папку Documents
level: A
difficulty: 1
estimated_time: 5
objectives:
- Открыть файловый менеджер
- Найти файл photo.jpg в папке Downloads
- Скопировать файл в папку Documents
hints:
- Откройте файловый менеджер через Меню → Файловый менеджер
- Или дважды кликните на иконку 'Домашняя папка' на рабочем столе
- Папка Downloads (~/Downloads) находится в вашей домашней директории
- Папка Documents (~/Documents) находится в вашей домашней директории
- Используйте Ctrl+C для копирования и Ctrl+V для вставки
setup:
  directories:
  - /root/Downloads
  - /root/Documents
  files:
  - path: /root/Downloads/photo.jpg
    source: photo.jpg
    mode: '644'
checks:
- name: Файл скопирован в Documents
  type: file_exists
  path: /root/Documents/photo.jpg
  file_type: file
  points: 100
