name: "Копирование файла"
description: "Скопируйте файл photo.jpg из папки Загрузки в папку Документы"
level: "A"
difficulty: 1
estimated_time: 5

objectives:
  - "Открыть файловый менеджер Thunar"
  - "Найти файл photo.jpg в папке Загрузки"
  - "Скопировать файл в папку Документы"

hints:
  - "Откройте файловый менеджер через Меню → Файловый менеджер"
  - "Или дважды кликните на иконку 'Домашняя папка' на рабочем столе"
  - "Папка Загрузки: /home/astrauser/Загрузки"
  - "Папка Документы: /home/astrauser/Документы"
  - "Используйте Ctrl+C для копирования и Ctrl+V для вставки"

setup:
  # Создаём тестовый файл
  files:
    - path: "/home/astrauser/Загрузки/photo.jpg"
      content: "test_photo_content"
  # Создаём папку Документы если её нет
  directories:
    - "/home/astrauser/Документы"

checks:
  - name: "Файл скопирован в Документы"
    type: "file_exists"
    path: "/home/astrauser/Документы/photo.jpg"
    points: 100

