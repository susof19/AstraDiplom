name: "Создать архив через контекстное меню файлового менеджера"
description: "Выделите в «Документах» папку ProjectFiles → правый клик → Compress → выберите формат .tar.gz и сохраните архив project_backup.tar.gz в домашнюю папку"
level: "A"
difficulty: 2
estimated_time: 5

objectives:
  - "Найти папку ProjectFiles в Документах"
  - "Открыть контекстное меню (правый клик)"
  - "Выбрать Compress (Создать архив)"
  - "Выбрать формат .tar.gz"
  - "Сохранить архив как project_backup.tar.gz в домашней папке"

hints:
  - "Файловый менеджер можно открыть через Меню → Файловый менеджер"
  - "Папка Documents (~/Documents) находится в вашей домашней директории"
  - "Для создания архива: правый клик на папке → Compress (Создать архив) или Архивировать"
  - "Выберите формат .tar.gz или tar.gz"
  - "Сохраните архив в домашней папке (~/) как project_backup.tar.gz"

setup:
  # Создаём директорию Documents и папку ProjectFiles с файлами
  directories:
    - "/root/Documents/ProjectFiles"
  files:
    - path: "/root/Documents/ProjectFiles/file1.txt"
      content: "Содержимое файла 1"
      mode: "644"
    - path: "/root/Documents/ProjectFiles/file2.txt"
      content: "Содержимое файла 2"
      mode: "644"
    - path: "/root/Documents/ProjectFiles/subfolder/file3.txt"
      content: "Содержимое файла 3"
      mode: "644"

checks:
  - name: "Архив project_backup.tar.gz создан в домашней папке"
    type: "file_exists"
    path: "/root/project_backup.tar.gz"
    file_type: "file"
    points: 40
  - name: "Архив содержит файлы из папки ProjectFiles"
    type: "command_output"
    command: "tar -tzf /root/project_backup.tar.gz 2>/dev/null | wc -l"
    operator: "greater_than"
    expected: "0"
    points: 30
  - name: "Архив содержит папку ProjectFiles"
    type: "command_output"
    command: "tar -tzf /root/project_backup.tar.gz 2>/dev/null | grep -i 'ProjectFiles' | head -1"
    operator: "contains"
    expected: "ProjectFiles"
    points: 30

