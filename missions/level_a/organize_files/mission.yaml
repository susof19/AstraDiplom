name: "Организация файлов"
description: "Создайте папку 'Работа' и переместите в неё все файлы .docx из папки Загрузки"
level: "A"
difficulty: 2
estimated_time: 7

objectives:
  - "Создать папку 'Работа' в домашней директории"
  - "Найти все файлы .docx в папке Загрузки"
  - "Переместить файлы в новую папку"

hints:
  - "Используйте файловый менеджер для создания папки"
  - "Можно использовать поиск для фильтрации файлов"

checks:
  - name: "Папка создана"
    type: "file_exists"
    path: "/home/user/Работа"
    points: 30
  - name: "Файлы перемещены"
    type: "command_output"
    command: "find /home/user/Работа -name '*.docx' | wc -l"
    expected: "0"
    points: 70

