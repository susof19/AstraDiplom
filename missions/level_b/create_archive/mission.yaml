name: "Создание архива"
description: "Создайте архив файлов из папки documents и сохраните его в домашней директории"
level: "B"
difficulty: 2
estimated_time: 10

objectives:
  - "Создать архив tar.gz из папки documents"
  - "Назвать архив backup.tar.gz"
  - "Сохранить архив в домашней директории"

hints:
  - "Используйте команду tar для создания архива"
  - "Синтаксис: tar -czf archive.tar.gz directory/"
  - "Флаг -c создаёт архив, -z сжимает gzip, -f указывает имя файла"
  - "Папка documents находится в /home/astrauser/documents"

setup:
  # Создаём тестовые файлы для архивирования
  directories:
    - "/home/astrauser/documents"
  files:
    - path: "/home/astrauser/documents/file1.txt"
      content: "Test file 1"
    - path: "/home/astrauser/documents/file2.txt"
      content: "Test file 2"
    - path: "/home/astrauser/documents/file3.txt"
      content: "Test file 3"

checks:
  - name: "Архив создан"
    type: "file_exists"
    path: "/home/astrauser/backup.tar.gz"
    points: 50
    
  - name: "Архив содержит файлы"
    type: "command_output"
    command: "tar -tzf /home/astrauser/backup.tar.gz | wc -l"
    expected: "> 0"
    points: 30
    
  - name: "Архив содержит правильные файлы"
    type: "command_output"
    command: "tar -tzf /home/astrauser/backup.tar.gz | grep -c 'file[123].txt'"
    expected: "3"
    points: 20
