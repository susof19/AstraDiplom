name: "Создать символическую ссылку"
description: "В домашней директории создайте символическую ссылку data_link.txt, которая указывает на файл Documents/data.txt. Используйте команду ln -s."
level: "B"
difficulty: 2
estimated_time: 4

objectives:
  - "Создать символическую ссылку data_link.txt на Documents/data.txt"
  - "Использовать команду ln -s"

hints:
  - "Посмотреть файлы в домашней директории: ls или ls -l"
  - "Для создания ссылки используйте: ln -s Documents/data.txt data_link.txt"
  - "Проверьте ссылку командой: ls -l data_link.txt"
  - "Проверьте содержимое: cat data_link.txt"

setup:
  directories:
    - "/home/sandboxuser/Documents"
  files:
    - path: "/home/sandboxuser/Documents/data.txt"
      content: "Данные для ссылки"
      mode: "644"

checks:
  - name: "Символическая ссылка data_link.txt существует"
    type: "file_exists"
    path: "/home/sandboxuser/data_link.txt"
    file_type: "file"
    points: 40
  - name: "Файл является символической ссылкой"
    type: "command_output"
    command: "test -L /home/sandboxuser/data_link.txt && echo 'symlink' || echo 'not_symlink'"
    operator: "contains"
    expected: "symlink"
    points: 30
  - name: "Ссылка указывает на правильный файл"
    type: "command_output"
    command: "readlink -f /home/sandboxuser/data_link.txt 2>/dev/null"
    operator: "contains"
    expected: "/home/sandboxuser/Documents/data.txt"
    points: 30

