name: "Найти файлы через терминал"
description: "В каталоге Documents/logs есть несколько файлов с расширением .log. С помощью команды find найдите все файлы с расширением .log внутри Documents/logs и сохраните полный путь к каждому файлу в logs_list.txt в домашней папке."
level: "B"
difficulty: 2
estimated_time: 5

objectives:
  - "Найти все .log файлы в Documents/logs"
  - "Сохранить полные пути в logs_list.txt"

hints:
  - "Посмотреть файлы в каталоге: ls Documents/logs"
  - "Для поиска используйте: find Documents/logs -name '*.log' > logs_list.txt"
  - "Проверьте результат командой: cat logs_list.txt"

setup:
  directories:
    - "/home/sandboxuser/Documents/logs"
  files:
    - path: "/home/sandboxuser/Documents/logs/app.log"
      content: "Лог приложения"
      mode: "644"
    - path: "/home/sandboxuser/Documents/logs/error.log"
      content: "Лог ошибок"
      mode: "644"
    - path: "/home/sandboxuser/Documents/logs/system.log"
      content: "Системный лог"
      mode: "644"
    - path: "/home/sandboxuser/Documents/logs/subdir/debug.log"
      content: "Отладочный лог"
      mode: "644"

checks:
  - name: "Файл logs_list.txt существует"
    type: "file_exists"
    path: "/home/sandboxuser/logs_list.txt"
    file_type: "file"
    points: 40
  - name: "Файл содержит пути к .log файлам"
    type: "command_output"
    command: "grep -c '\\.log$' /home/sandboxuser/logs_list.txt 2>/dev/null || echo '0'"
    operator: "greater_than"
    expected: "0"
    points: 30
  - name: "Количество строк соответствует количеству .log файлов"
    type: "command_output"
    command: "test $(find /home/sandboxuser/Documents/logs -name '*.log' 2>/dev/null | wc -l) -eq $(wc -l < /home/sandboxuser/logs_list.txt 2>/dev/null | tr -d ' ' || echo '0') && echo 'match' || echo 'no_match'"
    operator: "contains"
    expected: "match"
    points: 30

