name: "Поиск процессов"
description: "Найдите все процессы, использующие более 100MB памяти, и завершите их"
level: "B"
difficulty: 3
estimated_time: 15

objectives:
  - "Использовать ps или top для поиска процессов"
  - "Отфильтровать процессы по использованию памяти"
  - "Корректно завершить процессы"

hints:
  - "Используйте ps aux и awk для фильтрации"
  - "Будьте осторожны с системными процессами"

checks:
  - name: "Процессы найдены"
    type: "command_output"
    command: "ps aux | awk '\$6 > 102400' | wc -l"
    expected: "0"
    points: 100

