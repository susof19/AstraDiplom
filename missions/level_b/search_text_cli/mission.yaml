name: "Поиск текста в файле"
description: "В файле Documents/logs.txt найдите все строки (регистр не важен) с текстом ОШИБКА и сохраните результат в файл found.txt в домашней папке."
level: "B"
difficulty: 2
estimated_time: 5

objectives:
  - "Найти все строки с текстом ОШИБКА в файле Documents/logs.txt"
  - "Сохранить результат в файл found.txt в домашней папке"

hints:
  - "Посмотреть файлы: ls или ls Documents"
  - "Для поиска используйте команду: grep -i 'ОШИБКА' Documents/logs.txt > found.txt"
  - "Флаг -i делает поиск без учета регистра"
  - "Проверьте результат командой: cat found.txt"

setup:
  directories:
    - "/home/sandboxuser/Documents"
  files:
    - path: "/home/sandboxuser/Documents/logs.txt"
      content: |
        Сервис запущен успешно
        Проверка конфигурации
        ОШИБКА: таймаут соединения
        Логирование событий
        Критическая ОШИБКА доступа
        Соединение восстановлено
        ОШИБКА при записи в файл
      mode: "644"

checks:
  - name: "Файл found.txt существует в домашней папке"
    type: "file_exists"
    path: "/home/sandboxuser/found.txt"
    file_type: "file"
    points: 40
  - name: "Файл содержит строки с ОШИБКА"
    type: "command_output"
    command: "grep -i 'ОШИБКА' /home/sandboxuser/found.txt 2>/dev/null | wc -l"
    operator: "greater_than"
    expected: "0"
    points: 30
  - name: "Файл содержит правильные строки"
    type: "command_output"
    command: "grep -i 'ОШИБКА' /home/sandboxuser/found.txt 2>/dev/null | head -1"
    operator: "contains"
    expected: "ОШИБКА"
    points: 30

