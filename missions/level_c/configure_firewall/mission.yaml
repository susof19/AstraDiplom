name: "Настройка firewall"
description: "Настройте firewall для разрешения HTTP и SSH, блокировки остальных портов"
level: "C"
difficulty: 4
estimated_time: 30

objectives:
  - "Установить и настроить firewall"
  - "Разрешить порты 80 (HTTP) и 22 (SSH)"
  - "Заблокировать остальные входящие соединения"
  - "Проверить правила"

hints:
  - "Используйте ufw или iptables"
  - "Проверьте статус командой ufw status"
  - "Не забудьте включить firewall"

checks:
  - name: "Firewall активен"
    type: "command_output"
    command: "ufw status | grep -i active"
    expected: "active"
    points: 30
  - name: "HTTP разрешён"
    type: "command_output"
    command: "ufw status | grep '80/tcp'"
    expected: "80/tcp"
    points: 25
  - name: "SSH разрешён"
    type: "command_output"
    command: "ufw status | grep '22/tcp'"
    expected: "22/tcp"
    points: 25
  - name: "Политика по умолчанию установлена"
    type: "command_output"
    command: "ufw status verbose | grep 'Default:'"
    expected: "deny"
    points: 20

