name: "Создание systemd сервиса"
description: "Создайте простой systemd сервис для запуска скрипта"
level: "C"
difficulty: 3
estimated_time: 20

objectives:
  - "Создать unit-файл systemd"
  - "Настроить автозапуск сервиса"
  - "Проверить работу сервиса"

hints:
  - "Unit-файлы находятся в /etc/systemd/system/"
  - "Используйте systemctl для управления сервисами"
  - "Не забудьте выполнить systemctl daemon-reload после создания файла"
  - "Пример unit-файла: [Unit], [Service], [Install]"

setup:
  # Создаём тестовый скрипт
  files:
    - path: "/usr/local/bin/test-service.sh"
      content: |
        #!/bin/bash
        while true; do
          echo "Service is running" >> /tmp/test-service.log
          sleep 10
        done
      mode: "0755"

checks:
  - name: "Unit-файл создан"
    type: "file_exists"
    path: "/etc/systemd/system/test-service.service"
    points: 30
    
  - name: "Сервис включен"
    type: "command_output"
    command: "systemctl is-enabled test-service.service 2>/dev/null || echo 'disabled'"
    expected: "enabled"
    points: 30
    
  - name: "Сервис запущен"
    type: "command_output"
    command: "systemctl is-active test-service.service 2>/dev/null || echo 'inactive'"
    expected: "active"
    points: 40
