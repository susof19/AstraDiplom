name: Редактирование конфигов подключений через графический интерфейс
description: Используя графический редактор (например, Kate), открыть файл конфига
  подключения, изменить его содержимое и сохранить изменения на рабочем столе. Проверить
  результат визуально.
level: A
difficulty: 2
estimated_time: 5
objectives:
- Открыть графический редактор (например, Kate) через меню
- Найти и открыть конфиговый файл подключения (например, /root/config/conn.conf)
- Редактировать содержимое файла с помощью мыши или кнопки
- Сохранить изменения в файле на рабочем столе
hints:
- Текстовый редактор можно найти в Меню → Офис → Kate (или другой графический редактор)
- Конфиг подключения обычно находится в директории /root/config/
- Для сохранения используйте Файл → Сохранить или Ctrl+S
setup:
  directories:
  - /root/config
  - /root/Desktop
checks:
- name: Редактор открыта на рабочем столе
  type: file_exists
  path: /root/config/conn.conf
  file_type: file
  points: 50
- name: Файл конфига открыт для редактирования
  type: file_exists
  path: /root/Desktop/conn.conf
  file_type: file
  points: 50
- name: Содержимое файла содержит правильные данные
  type: file_content
  path: /root/config/conn.conf
  operator: contains
  expected: ваш текст для редактирования
  points: 60
