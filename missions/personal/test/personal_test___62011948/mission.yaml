name: Создание документа в OpenOffice Writer
description: В этой миссии ты научишься создавать документ в графическом редакторе
  OpenOffice Writer.
level: A
difficulty: 1
estimated_time: 5
objectives:
- Создать новый документ
- Изменить текст в созданном документе
- Сохранить документ с именем 'task.odt'
hints:
- Нажми кнопку 'Новый', чтобы создать новый документ
- Используй меню 'Формат' для изменения размера и шрифта текста
- Используй меню 'Файл' для сохранения документа
setup:
  directories:
  - /home/user
  files:
  - path: /home/user/task.odt
    mode: '644'
checks: []
